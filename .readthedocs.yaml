version: 2

# Build documentation in the docs/ directory with Sphinx
sphinx:
  configuration: docs/conf.py

# Dependencies required to build your docs
python:
  install:
    - requirements: requirements.txt
    - requirements: docs/requirements.txt
    - method: pip
      path: .
      extra_requirements:
        - docs

# Build environment
build:
  os: ubuntu-22.04
  tools:
    python: "3.10"
  jobs:
    pre_build:
      - pip install --upgrade pip
      - pip install sphinx sphinx-autoapi myst-parser sphinx-rtd-theme
      - pip install -e .

# Formats to build
formats:
  - pdf
  - epub

# Submodules
submodules:
  include:
    - docs
