site_name: RESK-LLM v2.1
site_description: Security toolkit for LLM applications
site_url: https://resk-llm.github.io/
repo_url: https://github.com/Resk-Security/Resk-LLM
repo_name: Resk-LLM

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - content.code.copy
    - content.action.edit
    - toc.integrate
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Quick Start: quickstart.md
  - Detectors: detectors.md
  - Protection: protection.md
  - Integrations: integrations.md
  - Configuration: configuration.md
  - CLI: cli.md
  - API Reference: api.md

markdown_extensions:
  - admonition
  - footnotes
  - toc:
      permalink: true
  - codehilite
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Resk-Security/Resk-LLM
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/resk-llm/

plugins:
  - search
