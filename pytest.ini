[tool:pytest]
# Configuration for pytest

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    security: Security tests
    slow: Slow running tests
    unit: mark test as a unit test
    integration: mark test as an integration test
    security: mark test as a security test
    slow: mark test as slow running

# Output and reporting
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --no-header
    --color=yes
    --durations=10
    --maxfail=5

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
    ignore::FutureWarning

# Test session configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Coverage (if pytest-cov is installed)
# addopts = --cov=resk_llm --cov-report=html --cov-report=term-missing

# Environment variables
env =
    PYTHONPATH = .
    RESK_TEST_MODE = true
    RESK_LOG_LEVEL = WARNING

# Minimum version
minversion = 6.0

# Timeout for tests (if pytest-timeout is installed)
# timeout = 30

# Parallel execution (if pytest-xdist is installed)
# addopts = -n auto

# Verbose output for debugging
# addopts = -s -vvv 