[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Configuration des rapports de test
addopts = 
    --verbose
    --color=yes
    --durations=10

# Ignorer certains répertoires lors de la recherche de tests
norecursedirs = 
    .git
    .github
    dist
    build
    *.egg-info
    __pycache__
    resk_llm.egg-info

# Marquer les tests lents pour pouvoir les exclure facilement
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests that require integration with external services
    unit: marks unit tests that don't require external services

# Configuration asyncio
asyncio_mode = strict

# Générer un rapport de couverture de code
# Pour l'activer: pytest --cov=resk_llm
[coverage:run]
source = resk_llm
omit = 
    tests/*
    */__init__.py
    */examples/*
    */setup.py
    */pre_release_check.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.:
    pass 