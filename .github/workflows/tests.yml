name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core dependencies
        run: |
          pip install -e .
          pip install pytest

      - name: Run core tests (no optional deps)
        run: pytest tests/test_resk2.py -v --tb=short

      - name: Install optional dependencies
        run: |
          pip install fastapi starlette httpx
          pip install openai

      - name: Run full integration test
        run: |
          python -c "
          from resk2 import ReskMiddleware, OpenAIWrapper
          print('FastAPI integration: OK')
          print('OpenAI integration: OK')
          "
