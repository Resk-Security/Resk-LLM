name: Python Package CI/CD

on:
  push:
    branches: [main]
    tags:
      - 'v*'  # Run workflow on version tags, e.g. v1.0.0
  pull_request:
    branches: [main]

# Remove id-token permission, keep contents: write for GH Release
permissions:
  contents: write # Required for creating GitHub Releases

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10']
    
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Use requirements.txt for testing dependencies
        pip install -r requirements.txt 
        pip install -e .[test] # Assuming you have a [test] extra or similar for flake8, mypy, pytest
        # If not, install them explicitly: pip install pytest flake8 mypy
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Type check with mypy
      run: |
        mypy --ignore-missing-imports resk_llm/
    - name: Test with pytest
      run: |
        pytest -v

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    # Only publish on tag push events
    if: startsWith(github.ref, 'refs/tags/v')
    permissions: # Keep contents: write for release creation
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install build and upload dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine # Re-added twine
    # - name: Run pre-release check # Keep commented unless needed
    #   run: |
    #     python pre_release_check.py
    - name: Build package
      run: |
        python -m build
    - name: Verify package distribution
      run: |
        twine check dist/* # Re-added twine check
    - name: Publish package to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }} # Use the secret token
      run: |
        twine upload dist/* --skip-existing # Re-added twine upload

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
        generate_release_notes: true
