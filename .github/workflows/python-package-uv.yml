name: Python Package CI/CD with UV

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Setup uv
      uses: astral-sh/setup-uv@v4
    
    - name: Install dependencies
      run: |
        uv pip install --system -e ".[all]"
        uv pip install --system pytest flake8 mypy
    
    - name: Lint with flake8
      run: |
        python -m flake8 ./resk2 --count --select=E9,F63,F7,F82 --show-source --statistics
        python -m flake8 ./resk2 --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

    - name: Type check with mypy
      run: |
        python -m mypy --ignore-missing-imports resk2/

    - name: Test with pytest
      run: |
        python -m pytest tests/test_resk2.py -v --tb=short --no-header --disable-warnings

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Setup uv
      uses: astral-sh/setup-uv@v4
    
    - name: Install build tools
      run: |
        uv pip install --system build twine
    
    - name: Build package
      run: |
        python -m build

    - name: Verify package distribution
      run: |
        python -m twine check dist/*

    - name: Publish package to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        python -m twine upload dist/* --skip-existing
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
        generate_release_notes: true
