name: Build and Deploy Documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'resk_llm/**'
      - '*.py'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'setup.py'
      - '.readthedocs.yml'
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'resk_llm/**'
      - '*.py'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'setup.py'
      - '.readthedocs.yml'

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: "docs"
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Important for version detection
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r docs/requirements.txt
        pip install -e .
    
    - name: Fix documentation links
      run: |
        cd docs
        python fix_links.py
    
    - name: Build documentation
      run: |
        cd docs
        make html
        mkdir -p ../public
        cp -r _build/html/* ../public/
    
    - name: Setup Pages
      uses: actions/configure-pages@v4
    
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './public'
    
    - name: Trigger Read the Docs build (v3 API)
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        RTD_TOKEN: ${{ secrets.RTD_TOKEN }}
        RTD_PROJECT: resk-llm
      run: |
        if [ -z "${RTD_TOKEN}" ]; then
          echo "Missing READTHEDOCS_TOKEN secret" >&2
          exit 1
        fi
        ref_name="${GITHUB_REF_NAME}"
        curl -sS -X POST \
          -H "Authorization: Token ${RTD_TOKEN}" \
          -H "Content-Type: application/json" \
          -d "{\"ref\":\"${ref_name}\"}" \
          https://readthedocs.org/api/v3/projects/${RTD_PROJECT}/versions/${ref_name}/builds/
    
  deploy-pages:
    needs: build-docs
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4 