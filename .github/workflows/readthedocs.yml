name: ReadTheDocs Webhook

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'resk_llm/**'
      - '*.py'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'setup.py'
      - '.readthedocs.yml'
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'resk_llm/**'
      - '*.py'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'setup.py'
      - '.readthedocs.yml'

jobs:
  trigger-readthedocs:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Trigger ReadTheDocs build
      run: |
        curl -X POST https://app.readthedocs.org/api/v2/webhook/resk-llm/305016/ \
          -H "Content-Type: application/json" \
          -d '{"repository": "${{ github.repository }}", "branch": "${{ github.ref_name }}", "commit": "${{ github.sha }}"}' 